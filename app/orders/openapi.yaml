openapi: 3.0.3
info:
  title: Orders API
  version: "1.0.0"
  description: >-
    Customer orders. This is the system of record: an order only exists once this API
    says it does, and order ids are issued here and nowhere else.

# APIM supplies the real backend URL (the Function App's private hostname) via
# service_url, so this is a placeholder only. Paths below are relative to it.
servers:
  - url: https://orders.invalid/api

paths:
  /orders:
    get:
      operationId: list-orders
      summary: List a customer's orders
      description: >-
        Return every order belonging to one customer, newest first. This is how to find
        an order id: ids are random and cannot be guessed or derived from a customer id.
      parameters:
        - name: customerId
          in: query
          required: true
          description: The customer whose orders to return, for example "acme-industries".
          schema:
            type: string
      responses:
        "200":
          description: The customer's orders. An empty list means the customer has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      operationId: create-order
      summary: Create an order
      description: >-
        Place a new order for a customer. The order id is generated by this API and
        returned in the response; never supply or predict one. This writes to the system
        of record and cannot be undone — confirm the customer and the items with the
        user before calling it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The created order, including its newly issued id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

  /orders/{orderId}:
    get:
      operationId: get-order
      summary: Get one order by id
      description: >-
        Return a single order. Use an id that came from listOrders or createOrder. If no
        such order exists the response is 404 — report that to the user rather than
        describing an order that is not there.
      parameters:
        - name: orderId
          in: path
          required: true
          description: The order id, for example "ORD-3F9A2B71".
          schema:
            type: string
        - name: customerId
          in: query
          required: false
          description: >-
            The owning customer, if known. Supplying it makes the lookup a direct read
            instead of a scan; omitting it still works.
          schema:
            type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: update-order
      summary: Update an order's status or items
      description: >-
        Change the status or the items of an existing order. Only the fields supplied
        are changed. This modifies the system of record — restate the change and get an
        explicit yes from the user before calling it.
      parameters:
        - name: orderId
          in: path
          required: true
          description: The id of the order to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /products:
    get:
      operationId: list-products
      summary: List all products in the catalogue
      description: >-
        Return every product with its current stock level. Use this when the user
        wants to know what products are available, or when you need to look up the
        right sku before checking stock or placing an order.
      responses:
        "200":
          description: All products with stock levels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/{sku}/stock:
    get:
      operationId: check-stock
      summary: Check whether a product is in stock
      description: >-
        Return the current stock level for one product. Call this before creating
        a customer order when the user names a product. If available is false or
        stockLevel is 0, the product must be replenished — use createPurchaseOrder
        to raise a supplier order first. If the sku does not exist the response is
        404; list products to find the right code.
      parameters:
        - name: sku
          in: path
          required: true
          description: The product code, for example "WIDGET-001".
          schema:
            type: string
      responses:
        "200":
          description: Stock information for the product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /purchase-orders:
    post:
      operationId: create-purchase-order
      summary: Raise a supplier replenishment order
      description: >-
        Place a purchase order to restock a product from the supplier. WRITES TO
        THE SYSTEM OF RECORD. Call only after checkStock confirms the product is
        out of stock and the user has explicitly agreed to the replenishment. The
        response includes an estimatedDeliveryAt date — relay this to the user and
        confirm before creating the customer order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderRequest"
      responses:
        "201":
          description: The created purchase order, including its estimated delivery date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /purchase-orders/{purchaseOrderId}:
    get:
      operationId: get-purchase-order
      summary: Get a supplier purchase order by id
      description: >-
        Return a single purchase order. Use the id returned by createPurchaseOrder.
        If no such order exists the response is 404. The purchaseOrderId is not
        guessable — do not invent one.
      parameters:
        - name: purchaseOrderId
          in: path
          required: true
          description: The purchase order id, for example "PO-3F9A2B71".
          schema:
            type: string
        - name: sku
          in: query
          required: false
          description: The product sku. Supplying it makes the lookup a direct read.
          schema:
            type: string
      responses:
        "200":
          description: The purchase order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: The request was rejected. `message` says what was wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    OrderItem:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
          description: The product code being ordered, for example "WIDGET-001".
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: How many of this product. Whole numbers of 1 or more.

    Order:
      type: object
      properties:
        orderId:
          type: string
          description: Issued by this API when the order is created.
        customerId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderList:
      type: object
      properties:
        customerId:
          type: string
        count:
          type: integer
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          description: The customer placing the order. Ask the user; do not invent one.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
          default: pending

    UpdateOrderRequest:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        customerId:
          type: string
          description: >-
            The owning customer, if known. Speeds the lookup; it cannot be changed by
            this call.

    Error:
      type: object
      properties:
        error:
          type: string
          description: A stable machine-readable code, for example "order_not_found".
        message:
          type: string
          description: What went wrong, in words safe to relay to the user.
        orderId:
          type: string

    Product:
      type: object
      properties:
        sku:
          type: string
          description: The product code, for example "WIDGET-001".
        name:
          type: string
          description: Human-readable product name.
        stockLevel:
          type: integer
          description: Units currently in stock.
        available:
          type: boolean
          description: True when stockLevel is greater than zero.

    ProductList:
      type: object
      properties:
        count:
          type: integer
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    PurchaseOrder:
      type: object
      properties:
        purchaseOrderId:
          type: string
          description: Issued by this API. For example "PO-3F9A2B71".
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [confirmed, delivered]
        requestedAt:
          type: string
          format: date-time
        estimatedDeliveryAt:
          type: string
          format: date-time
          description: The expected delivery date from the supplier.

    CreatePurchaseOrderRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          description: The product code to replenish. Must exist in the catalogue.
        quantity:
          type: integer
          minimum: 1
          description: How many units to order from the supplier.
