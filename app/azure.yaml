name: rag-app
services:
  rag-agent:
    name: rag-agent
    host: azure.ai.agent
    project: agent
    language: python
    kind: hosted
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    docker:
      path: ./Dockerfile
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: apim-gateway/gpt-4o
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
