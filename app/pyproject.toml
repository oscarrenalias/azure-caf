[project]
name = "rag-app"
version = "0.1.0"
description = "Azure AI Foundry reference app — RAG chatbot with LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    # Shared across agent and UI
    "azure-identity>=1.25.0",
    "azure-ai-projects>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
agent = [
    "langchain-azure-ai[hosting]>=1.2.8",
    "azure-search-documents>=11.6.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.5.0",
    "openai>=2.50.0,<3",
    "httpx<1",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0,<1",
]

[tool.uv]
# Required because langchain-azure-ai depends on azure-ai-contentunderstanding pre-release
prerelease = "allow"
dev-dependencies = [
    "debugpy>=1.8.0",
]
