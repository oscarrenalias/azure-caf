<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0078d4;
      color: #fff;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .bubble {
      max-width: 72%;
      padding: 0.7rem 1rem;
      border-radius: 1.25rem;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      background: #0078d4;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 0.3rem;
    }

    .bubble.agent {
      background: #fff;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 0.3rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .bubble.agent.thinking {
      color: #999;
      font-style: italic;
    }

    .bubble.agent.error {
      color: #c0392b;
    }

    #input-row {
      background: #fff;
      border-top: 1px solid #dde1e7;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: flex-end;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1.5px solid #ccc;
      border-radius: 1.25rem;
      font-size: 0.92rem;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      max-height: 8rem;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s;
    }

    #input:focus { border-color: #0078d4; }

    #send-btn {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: #0078d4;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #005fa3; }
    #send-btn:disabled { background: #b0c4d8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>AI Assistant</header>

  <div id="messages">
    <div class="bubble agent">Hello! How can I help you today?</div>
  </div>

  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Type a message…" autofocus></textarea>
    <button id="send-btn" title="Send (Enter)">&#8593;</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('input');
    const sendBtn    = document.getElementById('send-btn');

    let previousResponseId = null;

    function appendBubble(text, role, extraClass) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role + (extraClass ? ' ' + extraClass : '');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      autoResize();
      sendBtn.disabled = true;

      appendBubble(text, 'user');
      const agentBubble = appendBubble('Thinking…', 'agent', 'thinking');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, previous_response_id: previousResponseId }),
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          agentBubble.textContent = 'Error: ' + (data.error || res.statusText);
          agentBubble.classList.replace('thinking', 'error');
        } else {
          agentBubble.textContent = data.response || '(empty response)';
          agentBubble.classList.remove('thinking');
          previousResponseId = data.response_id || null;
        }
      } catch (err) {
        agentBubble.textContent = 'Network error: ' + err.message;
        agentBubble.classList.replace('thinking', 'error');
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + 'px';
    }

    sendBtn.addEventListener('click', send);

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    inputEl.addEventListener('input', autoResize);
  </script>
</body>
</html>
