on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: lz01
        type: choice
        options:
          - lz01
      tag:
        description: 'Image tag (leave empty to use the short git SHA)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

name: agentdeploy
run-name: agentdeploy | ${{ github.event.inputs.environment }} | ${{ github.ref_name }} | ${{ github.sha }}

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Clean workspace
        run: rm -rf ${{ github.workspace }}/app

      - uses: actions/checkout@v7

      - name: Environment variables
        run: |
          grep -v '^\s*#' config/global.env | grep -v '^\s*$' >>$GITHUB_ENV || true
          echo -e "\n" >>$GITHUB_ENV
          grep -v '^\s*#' config/${{ github.event.inputs.environment }}.env | grep -v '^\s*$' >>$GITHUB_ENV || true
          echo -e "\n" >>$GITHUB_ENV

      - name: Resolve names
        run: |
          NUMBER=$(grep number config/global.tfvars | cut -d= -f2 | tr -d ' "')
          LZ=$(grep '^lz ' config/${{ github.event.inputs.environment }}.tfvars | cut -d= -f2 | tr -d ' "')
          echo "RESOURCE_GROUP=rg${NUMBER}-${LZ}" >>$GITHUB_ENV
          TAG="${{ github.event.inputs.tag }}"
          echo "IMAGE_TAG=${TAG:-${GITHUB_SHA::7}}" >>$GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].loginServer" -o tsv)
          echo "ACR_NAME=${ACR_NAME}" >>$GITHUB_ENV
          echo "ACR_LOGIN_SERVER=${ACR_SERVER}" >>$GITHUB_ENV

      - name: Install Docker
        run: |
          if ! command -v docker &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          # Make the socket accessible to the runner user without sudo
          sudo chmod 666 /var/run/docker.sock

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build
        run: |
          docker build \
            -f app/agent/Dockerfile \
            -t ${{ env.ACR_LOGIN_SERVER }}/rag-agent:${{ env.IMAGE_TAG }} \
            app/agent/

      - name: Push
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/rag-agent:${{ env.IMAGE_TAG }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/rag-agent:${{ env.IMAGE_TAG }} \
            ${{ env.ACR_LOGIN_SERVER }}/rag-agent:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/rag-agent:latest

      - name: Summary
        run: |
          echo "### Agent image pushed :rocket:" >>$GITHUB_STEP_SUMMARY
          echo "| | |" >>$GITHUB_STEP_SUMMARY
          echo "|---|---|" >>$GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.ACR_LOGIN_SERVER }}\` |" >>$GITHUB_STEP_SUMMARY
          echo "| Tagged | \`rag-agent:${{ env.IMAGE_TAG }}\` |" >>$GITHUB_STEP_SUMMARY
          echo "| Also | \`rag-agent:latest\` |" >>$GITHUB_STEP_SUMMARY

  deploy-agent:
    runs-on: self-hosted
    needs: build-push
    steps:
      - name: Clean workspace
        run: rm -rf ${{ github.workspace }}/app

      - uses: actions/checkout@v7

      - name: Environment variables
        run: |
          grep -v '^\s*#' config/global.env | grep -v '^\s*$' >>$GITHUB_ENV || true
          echo -e "\n" >>$GITHUB_ENV
          grep -v '^\s*#' config/${{ github.event.inputs.environment }}.env | grep -v '^\s*$' >>$GITHUB_ENV || true
          echo -e "\n" >>$GITHUB_ENV

      - name: Resolve names
        run: |
          NUMBER=$(grep number config/global.tfvars | cut -d= -f2 | tr -d ' "')
          LZ=$(grep '^lz ' config/${{ github.event.inputs.environment }}.tfvars | cut -d= -f2 | tr -d ' "')
          echo "RESOURCE_GROUP=rg${NUMBER}-${LZ}" >>$GITHUB_ENV
          TAG="${{ github.event.inputs.tag }}"
          echo "IMAGE_TAG=${TAG:-${GITHUB_SHA::7}}" >>$GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Resolve ACR and Foundry project
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].loginServer" -o tsv)
          echo "ACR_NAME=${ACR_NAME}" >>$GITHUB_ENV
          echo "ACR_LOGIN_SERVER=${ACR_SERVER}" >>$GITHUB_ENV

          FOUNDRY_HUB=$(az resource list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --resource-type "Microsoft.CognitiveServices/accounts" \
            --query "[?starts_with(name, 'hub')].name | [0]" -o tsv)
          echo "FOUNDRY_HUB_NAME=${FOUNDRY_HUB}" >>$GITHUB_ENV

          FOUNDRY_HUB_ID=$(az resource show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --resource-type "Microsoft.CognitiveServices/accounts" \
            --name "${FOUNDRY_HUB}" \
            --query "id" -o tsv)

          FOUNDRY_PROJECT="proj${FOUNDRY_HUB#hub}"
          echo "FOUNDRY_PROJECT_NAME=${FOUNDRY_PROJECT}" >>$GITHUB_ENV

          FOUNDRY_PROJECT_ID="${FOUNDRY_HUB_ID}/projects/${FOUNDRY_PROJECT}"
          echo "FOUNDRY_PROJECT_ID=${FOUNDRY_PROJECT_ID}" >>$GITHUB_ENV

      - name: Install Docker
        run: |
          if ! command -v docker &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          sudo chmod 666 /var/run/docker.sock

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Install azd
        run: |
          if ! command -v azd &>/dev/null; then
            curl -fsSL https://aka.ms/install-azd.sh | bash
          fi

      - name: Install azure.ai.agents extension
        run: azd extension install azure.ai.agents --source azd

      - name: azd auth login
        run: |
          azd auth login \
            --client-id "${{ env.ARM_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ env.ARM_TENANT_ID }}"

      - name: Configure azd environment
        working-directory: app
        run: |
          azd env new lz01 --no-prompt 2>/dev/null || azd env select lz01
          azd env set AZURE_SUBSCRIPTION_ID "${{ env.ARM_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "${{ env.RESOURCE_GROUP }}"
          azd env set AZURE_AI_PROJECT_NAME "${{ env.FOUNDRY_PROJECT_NAME }}"
          azd env set AZURE_AI_PROJECT_ID "${{ env.FOUNDRY_PROJECT_ID }}"
          azd env set AZURE_CONTAINER_REGISTRY_NAME "${{ env.ACR_NAME }}"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "${{ env.ACR_LOGIN_SERVER }}"
          azd env set FOUNDRY_PROJECT_ENDPOINT "https://${{ env.FOUNDRY_HUB_NAME }}.services.ai.azure.com/api/projects/${{ env.FOUNDRY_PROJECT_NAME }}"
          azd env set AZURE_LOCATION "swedencentral"

          # Values referenced by the env: block in app/azure.yaml. Without these,
          # ${...} substitution resolves to empty at deploy time.
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "apim-gateway/gpt-4o"
          azd env set AZURE_AI_EMBEDDING_DEPLOYMENT_NAME "apim-gateway/text-embedding-3-small"

          SEARCH_NAME=$(az search service list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          azd env set SEARCH_ENDPOINT "https://${SEARCH_NAME}.search.windows.net"
          azd env set SEARCH_INDEX_NAME "knowledge-base"
          azd env set SEARCH_API_KEY "$(az search admin-key show --service-name ${SEARCH_NAME} --resource-group ${{ env.RESOURCE_GROUP }} --query primaryKey -o tsv)"

      - name: Install yq
        run: |
          if ! command -v yq &>/dev/null; then
            sudo curl -fsSLo /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

      # app/azure.yaml is the single source of truth for the agent definition:
      # dependency resolution, environment, protocols, container resources.
      # The one thing it cannot express is the Foundry project name — it carries a
      # random_id suffix (see infra/lz01/foundry.tf) and appears as a service *key*,
      # not a value, so ${...} substitution can't cover it. Patch it in rather than
      # regenerating the file, so changes to azure.yaml actually reach deployments.
      - name: Bind agent to the Foundry project
        working-directory: app
        run: |
          yq -i '
            .services["rag-agent"].uses = [strenv(FOUNDRY_PROJECT_NAME)] |
            .services[strenv(FOUNDRY_PROJECT_NAME)].host = "azure.ai.project"
          ' azure.yaml
          echo "=== azure.yaml used for this deploy ==="
          cat azure.yaml

      - name: Deploy agent
        working-directory: app
        run: azd deploy

      # The platform creates a managed identity for the agent on first deploy
      # ("<account>-<project>-<agent>-AgentIdentity"), and it starts with no role
      # assignments — so the container cannot call the project data plane it needs
      # for connected-mode model calls. Terraform can't own this: the principal
      # doesn't exist until the agent is deployed. The principal id is read from the
      # agent definition rather than Entra ID, so no Graph permissions are needed.
      - name: Grant the agent identity access to the project
        run: |
          TOKEN=$(az account get-access-token --scope https://ai.azure.com/.default --query accessToken -o tsv)
          curl -fsS \
            "${FOUNDRY_PROJECT_ENDPOINT}/agents/rag-agent?api-version=2025-11-15-preview" \
            -H "Authorization: Bearer $TOKEN" -o /tmp/agent.json
          PRINCIPAL=$(python3 -c "import json;print((json.load(open('/tmp/agent.json'))['versions']['latest'].get('instance_identity') or {}).get('principal_id',''))")

          if [ -z "$PRINCIPAL" ]; then
            echo "::error::could not read the agent's instance identity principal id"
            exit 1
          fi
          echo "Agent identity principal: $PRINCIPAL"

          SCOPE="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/${FOUNDRY_HUB_NAME}"
          if az role assignment list --assignee "$PRINCIPAL" --scope "$SCOPE" \
               --query "[?roleDefinitionName=='Foundry Project Manager'] | length(@)" -o tsv | grep -qv '^0$'; then
            echo "Role assignment already present."
          else
            az role assignment create \
              --assignee-object-id "$PRINCIPAL" \
              --assignee-principal-type ServicePrincipal \
              --role "Foundry Project Manager" \
              --scope "$SCOPE" \
              --only-show-errors -o none
            echo "Granted Foundry Project Manager to the agent identity."
          fi
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://${{ env.FOUNDRY_HUB_NAME }}.services.ai.azure.com/api/projects/${{ env.FOUNDRY_PROJECT_NAME }}

      - name: Show agent status on failure
        if: failure()
        working-directory: app
        run: |
          echo "=== azd ai agent show ==="
          azd ai agent show rag-agent 2>&1 || true
          echo "=== All agent versions ==="
          azd ai agent version list rag-agent 2>&1 || true

      - name: Summary
        run: |
          echo "### Agent deployed to Foundry Agent Service" >>$GITHUB_STEP_SUMMARY
          echo "| | |" >>$GITHUB_STEP_SUMMARY
          echo "|---|---|" >>$GITHUB_STEP_SUMMARY
          echo "| Project | \`${{ env.FOUNDRY_PROJECT_NAME }}\` |" >>$GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.ACR_LOGIN_SERVER }}/rag-agent:${{ env.IMAGE_TAG }}\` |" >>$GITHUB_STEP_SUMMARY
